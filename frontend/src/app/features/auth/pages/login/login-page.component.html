<main class="login-page">
  <header class="login-page__header">
    <a routerLink="/" class="brand">Airsoft ID</a>
  </header>

  <section class="login-card">
    <h1>Вход в Airsoft ID</h1>
    <p class="subtitle">Войдите в аккаунт, чтобы продолжить.</p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="email"
      />
      <p class="field-error" *ngIf="emailControl.touched && emailControl.hasError('required')">
        Email обязателен.
      </p>
      <p class="field-error" *ngIf="emailControl.touched && emailControl.hasError('email')">
        Укажите корректный email.
      </p>

      <label for="password">Пароль</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <p class="field-error" *ngIf="passwordControl.touched && passwordControl.hasError('required')">
        Пароль обязателен.
      </p>
      <p class="field-error" *ngIf="passwordControl.touched && passwordControl.hasError('minlength')">
        Пароль должен содержать минимум 6 символов.
      </p>

      <p class="api-error" *ngIf="apiError()">{{ apiError() }}</p>

      <button type="submit" [disabled]="isFormInvalid()">
        {{ isSubmitting() ? 'Вход...' : 'Войти' }}
      </button>
    </form>

    <p class="hint">
      Нет аккаунта?
      <a routerLink="/register">Зарегистрироваться</a>
    </p>
  </section>
</main>
